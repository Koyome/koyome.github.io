<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_catalog">Catalog · Koyome</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9c7c2' stroke-width='1.5'/><circle cx='16' cy='16' r='4' fill='%239e2b25'/></svg>" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("koyome_theme")==="dark"?"dark":"light"}catch(_){document.documentElement.dataset.theme="light"}</script>
  <link rel="stylesheet" href="css/style.css?v=202610090447" />
</head>
<body data-page="catalog" data-title-key="title_catalog">

  <!-- page transition veil: hexagram sigil, same language as the home loader -->

  <header class="site-header" id="siteHeader"></header>

  <section class="section">
    <!-- a compass rose ringed by constellations — the index's night sky -->
    <img class="cat-stars" src="assets/deco_constellation.webp" data-dark-src="assets/deco_constellation_dark.webp" alt="" aria-hidden="true" decoding="async" />
    <div class="section-head" data-reveal>
      <span class="zh" data-i18n="sec_catalog">Catalog</span>
      <span class="en" data-i18n="sec_catalog_en">INDEX</span>
      <span class="count" id="totalCount"></span>
    </div>

    <p class="section-intro" data-reveal style="--d:0.06s" data-i18n="catalog_intro">Everything I have kept so far, grouped by category. Click any title to open its own page.</p>

    <p class="edit-hint" id="editHint" hidden></p>

    <div class="cat-index" id="catIndex"></div>

    <div id="catGroups"></div>
  </section>

  <footer class="site-footer">
    <span data-i18n="footer">© 2026 KOYOME. ALL RIGHTS RESERVED.</span> &nbsp;·&nbsp; <span class="addr">KOYOME.ME</span>
  </footer>

  <script src="js/i18n.js?v=202610092315"></script>
  <script src="js/header.js?v=202610090447"></script>
  <script src="js/data.js?v=202610090447"></script>
  <script src="js/gb-config.js?v=202610090447"></script>
  <script src="js/visit-beacon.js?v=202610090447"></script>
  <script src="js/deco.js?v=202610090447"></script>
  <script src="js/catalog.js?v=202610090447"></script>
</body>
</html>
