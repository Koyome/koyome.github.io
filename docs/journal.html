<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_journal">Journal · Koyome</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9c7c2' stroke-width='1.5'/><circle cx='16' cy='16' r='4' fill='%239e2b25'/></svg>" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("koyome_theme")==="dark"?"dark":"light"}catch(_){document.documentElement.dataset.theme="light"}</script>
  <link rel="stylesheet" href="css/style.css?v=202610070607" />
</head>
<body data-page="journal" data-title-key="title_journal">

  <header class="site-header" id="siteHeader"></header>

  <section class="jr-wrap">
    <div class="section-head">
      <span class="zh" data-i18n="journal_title">Journal</span>
      <span class="en" data-i18n="journal_en">THE ROAD SO FAR</span>
      <span class="count" id="jrCount"></span>
    </div>

    <p class="jr-intro" id="jrIntro"></p>

    <div class="jr-list" id="jrList"></div>

    <!-- the visitor roll: only ever rendered on the machine running
         server.js, because it is served by the local API -->
    <div class="vs-section" id="vsSection" hidden>
      <div class="vs-head">
        <span class="vs-title" data-i18n="visit_title">Visitors</span>
        <span class="vs-en" data-i18n="visit_en">WHO KNOCKED</span>
        <span class="vs-total" id="vsTotal"></span>
        <button type="button" class="vs-clear" id="vsClear" data-i18n="visit_clear">CLEAR</button>
      </div>
      <div class="vs-scroll">
        <table class="vs-table">
          <thead>
            <tr>
              <th data-i18n="visit_time">TIME</th>
              <th data-i18n="visit_ip">ADDRESS</th>
              <th data-i18n="visit_where">WHERE</th>
              <th data-i18n="visit_isp">NETWORK</th>
              <th data-i18n="visit_page">PAGE</th>
              <th data-i18n="visit_geo">COORDINATES</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="vsBody"></tbody>
        </table>
      </div>
      <p class="vs-note" id="vsNote"></p>
    </div>
  </section>

  <footer class="site-footer">
    <span data-i18n="footer">© 2026 KOYOME. ALL RIGHTS RESERVED.</span> &nbsp;·&nbsp; <span class="addr">KOYOME.ME</span>
  </footer>

  <script src="js/i18n.js?v=202610070607"></script>
  <script src="js/header.js?v=202610070607"></script>
  <script src="js/data.js?v=202610070607"></script>
  <script src="js/gb-config.js?v=202610070607"></script>
  <script src="js/visit-beacon.js?v=202610070607"></script>
  <script src="js/deco.js?v=202610070607"></script>
  <script src="js/journal.js?v=202610070607"></script>
</body>
</html>
