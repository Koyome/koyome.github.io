<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_hobbies">Hobbies · Koyome</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9c7c2' stroke-width='1.5'/><circle cx='16' cy='16' r='4' fill='%239e2b25'/></svg>" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("koyome_theme")==="dark"?"dark":"light"}catch(_){document.documentElement.dataset.theme="light"}</script>
  <link rel="stylesheet" href="css/style.css?v=202609271353" />
</head>
<body data-page="hobbies" data-title-key="title_hobbies">

  <!-- page transition veil: hexagram sigil, same language as the home loader -->

  <header class="site-header" id="siteHeader"></header>

  <section class="hob-wrap">
    <div class="section-head" data-reveal>
      <span class="zh" data-i18n="hob_title">Hobbies</span>
      <span class="en" data-i18n="hob_en">THINGS I LOVE</span>
      <span class="count" id="hobCount"></span>
    </div>

    <p class="section-intro hob-intro" id="hobIntro" data-reveal style="--d:0.08s"></p>
    <p class="edit-hint" id="hobEditHint" hidden></p>

    <!-- sections (anime / characters / galgame) rendered here -->
    <div id="hobSections"></div>
    <p class="hob-msg" id="hobMsg"></p>

    <!-- chibi decoration layer: slots pinned to the viewport,
         never pushed down by growing content -->
    <div class="hdeco-layer" id="hdecoLayer" aria-hidden="true"></div>
  </section>

  <input type="file" id="hobFile" accept="image/*" hidden />

  <footer class="site-footer">
    <span data-i18n="footer">© 2026 KOYOME. ALL RIGHTS RESERVED.</span> &nbsp;·&nbsp; <span class="addr">KOYOME.ME</span>
  </footer>

  <script src="js/i18n.js?v=202609271353"></script>
  <script src="js/header.js?v=202609271353"></script>
  <script src="js/data.js?v=202609271353"></script>
  <script src="js/deco.js?v=202609271353"></script>
  <script src="js/hobbies.js?v=202609271353"></script>
</body>
</html>
