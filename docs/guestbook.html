<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_guestbook">Guestbook · Koyome</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9c7c2' stroke-width='1.5'/><circle cx='16' cy='16' r='4' fill='%239e2b25'/></svg>" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("koyome_theme")==="dark"?"dark":"light"}catch(_){document.documentElement.dataset.theme="light"}</script>
  <link rel="stylesheet" href="css/style.css?v=202610070607" />
</head>
<body data-page="guestbook" data-title-key="title_guestbook">

  <!-- page transition veil: hexagram sigil, same language as the home loader -->

  <header class="site-header" id="siteHeader"></header>

  <section class="gb-wrap">
    <!-- a small chapel — its spire star burns accent red, and glows
         softly after dark (two stacked layers, same canvas) -->
    <span class="gb-chapel" aria-hidden="true">
      <img src="assets/deco_chapel.webp" data-dark-src="assets/deco_chapel_dark.webp" alt="" decoding="async" />
      <img class="gb-chapel-star" src="assets/deco_chapel_star.webp" alt="" decoding="async" />
    </span>
    <div class="section-head">
      <span class="zh" data-i18n="gb_title">Guestbook</span>
      <span class="en" data-i18n="gb_en">LEAVE A NOTE</span>
      <span class="count" id="gbCount"></span>
    </div>

    <p class="gb-intro" data-i18n="gb_intro">Say something — every note is visible to everyone, me included.</p>

    <form class="gb-form" id="gbForm">
      <div class="field">
        <label for="gbName" data-i18n="gb_name">NAME</label>
        <input type="text" id="gbName" data-i18n-ph="ph_name" placeholder="your name" maxlength="40" required />
      </div>
      <div class="field">
        <label for="gbText" data-i18n="gb_msg">MESSAGE</label>
        <textarea id="gbText" data-i18n-ph="ph_msg" placeholder="write something…" maxlength="2000" required></textarea>
      </div>
      <!-- honeypot: invisible to humans, bots fill it and get dropped -->
      <div class="hp" aria-hidden="true">
        <label for="gbSite">Website</label>
        <input type="text" id="gbSite" name="website" tabindex="-1" autocomplete="off" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn" data-i18n="gb_send">SEND</button>
        <span class="form-msg" id="gbMsg"></span>
      </div>
    </form>

    <div class="gb-list" id="gbList"></div>
  </section>

  <footer class="site-footer">
    <span data-i18n="footer">© 2026 KOYOME. ALL RIGHTS RESERVED.</span> &nbsp;·&nbsp; <span class="addr">KOYOME.ME</span>
  </footer>

  <script src="js/gb-config.js?v=202610070607"></script>
  <script src="js/i18n.js?v=202610070607"></script>
  <script src="js/header.js?v=202610070607"></script>
  <script src="js/data.js?v=202610070607"></script>
  <script src="js/visit-beacon.js?v=202610070607"></script>
  <script src="js/deco.js?v=202610070607"></script>
  <script src="js/guestbook.js?v=202610070607"></script>
</body>
</html>
